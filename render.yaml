services:
  - type: web
    name: the-eye-qa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        value: mridul
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: the-eye-qa-db
          property: connectionString
databases:
  - name: the-eye-qa-db
    databaseName: theeyeqa
    user: theeyeqa
