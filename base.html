<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>{% block title %}THE EYE | Q&A{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="eye">◉</span> THE EYE <span class="brand-small">/ Q&A</span></a>
    <a class="admin-link" href="{{ url_for('admin_login') }}">ADMIN ACCESS</a>
  </header>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="messages">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  <main>{% block content %}{% endblock %}</main>
  <footer>Created by <span>~ Mridul</span></footer>
</body>
</html>
